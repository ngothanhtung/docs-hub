# Hạ tầng cho môi trường dev. Production dùng DigitalOcean managed PostgreSQL/Redis và AWS S3.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docshub
      POSTGRES_PASSWORD: docshub
      POSTGRES_DB: docshub
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docshub']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: docshub-dev-master-key
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - meili-data:/meili_data

  # S3 giả lập cho dev. MinIO đã ngừng phát hành image công khai nên dùng RustFS (tương thích S3, Apache-2.0).
  # Production dùng AWS S3. Giao diện quản trị: http://localhost:9001
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: docshub
      RUSTFS_SECRET_KEY: docshub-dev-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  meili-data:
  s3-data:
